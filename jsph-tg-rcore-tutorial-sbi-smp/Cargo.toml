[package]
name = "jsph-tg-rcore-tutorial-sbi-smp"
description = "SMP-capable SBI for rCore tutorial — multi-hart M-mode boot with per-hart stacks and CLINT timer."
version = "0.4.8"
edition = "2024"
authors = ["Joseph Joshua Anggita <jj.anggita@gmail.com>"]
repository = "https://github.com/rcore-os/tg-rcore-tutorial-sbi"
homepage = "https://github.com/rcore-os/tg-rcore-tutorial-sbi/tree/test"
documentation = "https://docs.rs/tg-rcore-tutorial-sbi"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "sbi", "no-std", "riscv"]
categories = ["no-std", "embedded"]

[features]
default = []
nobios = []

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]

[dependencies]
