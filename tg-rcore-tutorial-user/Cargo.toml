[package]
name = "jsph-tg-rcore-tutorial-user"
description = "User-space apps for rCore Tutorial chapters"
version = "0.4.12"
edition = "2024"
authors = ["Joseph Joshua Anggita <jj.anggita@gmail.com>"]
repository = "https://github.com/JosephJoshua/tg-rcore-tutorial"
homepage = "https://github.com/JosephJoshua/tg-rcore-tutorial"
documentation = "https://docs.rs/jsph-tg-rcore-tutorial-user"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "user-apps"]
categories = ["no-std", "embedded"]

[lib]
name = "user_lib"
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
tg-console = { package = "tg-rcore-tutorial-console", version = "0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", version = "0.4.8", features = ["user"] }
customizable-buddy = "0.0.2"

[features]
tangram = []
snake = []
tetris = []
pingpong = []
breakout = []

[workspace]
