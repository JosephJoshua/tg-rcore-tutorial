# Default build target: RISC-V 64-bit bare-metal
[build]
target = "riscv64gc-unknown-none-elf"

# QEMU runner with SMP support (4 harts)
[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",
    "-nographic",
    "-bios", "none",
    "-smp", "4",
    "-kernel",
]

# tg-user configuration for build.rs
[env]
TG_USER_CRATE     = "tg-rcore-tutorial-user"
TG_USER_LOCAL_DIR = "../tg-rcore-tutorial-user"
TG_USER_VERSION   = "0.4.8"
