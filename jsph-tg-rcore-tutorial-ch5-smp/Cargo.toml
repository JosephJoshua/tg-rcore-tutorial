[package]
name = "jsph-tg-rcore-tutorial-ch5-smp"
description = "Chapter 5 of rCore Tutorial with SMP: Process management with fork, exec and wait syscalls on multiple harts."
version = "0.4.8"
edition = "2024"
authors = ["Joseph Joshua Anggita <jj.anggita@gmail.com>"]
documentation = "https://docs.rs/tg-rcore-tutorial-ch5"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "process"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-user/**",
#    ".cargo/config.toml",
]

[features]
exercise = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
xmas-elf = "0.8.0"
riscv = "0.10.1"
spin = "0.9"

tg-sbi = { package = "jsph-tg-rcore-tutorial-sbi-smp", path = "../jsph-tg-rcore-tutorial-sbi-smp", version = "0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", version = "0.4.8", features = ["foreign"] }
tg-kernel-alloc = { package = "jsph-tg-rcore-tutorial-kernel-alloc-smp", path = "../jsph-tg-rcore-tutorial-kernel-alloc-smp", version = "0.4.8" }
tg-kernel-vm = { package = "tg-rcore-tutorial-kernel-vm", version = "0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", version = "0.4.8", features = ["kernel"] }
tg-task-manage = { package = "tg-rcore-tutorial-task-manage", version = "0.4.8", features = ["proc"] }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
