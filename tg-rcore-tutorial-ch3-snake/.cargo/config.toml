[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",
    "-serial", "stdio",
    "-bios", "none",
    "-device", "virtio-gpu-device",
    "-device", "virtio-keyboard-device",
    "-kernel",
]

[env]
TG_USER_CRATE     = "jsph-tg-rcore-tutorial-user"
TG_USER_LOCAL_DIR = "../tg-rcore-tutorial-user"
TG_USER_VERSION   = "0.4.9"
